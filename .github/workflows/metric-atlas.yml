name: Language metric atlas source export
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/atlas/**'
      - 'metric-map.html'
      - '.github/workflows/metric-atlas.yml'
permissions:
  contents: read
concurrency:
  group: metric-atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ATLAS_SOURCE_SHA: 132fb3c8d2a391aa6a5a9ea47d13493b00182e5a
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: 132fb3c8d2a391aa6a5a9ea47d13493b00182e5a
          path: upstream
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: upstream/go.sum
      - name: Export existing registries from a disposable source copy
        shell: bash
        run: |
          set -euo pipefail
          cp -R upstream "$RUNNER_TEMP/atlas-source"
          mkdir -p "$RUNNER_TEMP/atlas-source/cmd/metric-atlas-export" atlas-output
          cp scripts/atlas/*.go "$RUNNER_TEMP/atlas-source/cmd/metric-atlas-export/"
          cd "$RUNNER_TEMP/atlas-source"
          go run -mod=readonly ./cmd/metric-atlas-export > "$GITHUB_WORKSPACE/atlas-output/catalog.json"
      - name: Exercise partial contract AST fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atlas-source"
          go test -mod=readonly ./cmd/metric-atlas-export
      - name: Render source-backed map and record collection scope
        run: node scripts/atlas/render.mjs atlas-output/catalog.json scripts/atlas/template.html atlas-output/metric-map.html upstream
      - name: Verify pinned release metric formula bindings
        shell: bash
        run: |
          set -euo pipefail
          catalog=atlas-output/catalog.json
          receipt=atlas-output/metric-map.html.receipt.json
          test "$(jq -r '.release_metric_contracts.schema' "$catalog")" = gooo/source-release-metric-contracts/v1
          test "$(jq -r '.release_metric_contracts.source_sha' "$catalog")" = "$ATLAS_SOURCE_SHA"
          test "$(jq '.release_metric_contracts.source_files | length' "$catalog")" -eq 6
          test "$(jq '.release_metric_contracts.metric_count' "$catalog")" -eq 39
          test "$(jq '.release_metric_contracts.contracts | length' "$catalog")" -eq 39
          test "$(jq '.release_metric_contracts.unknowns | length' "$catalog")" -eq 0
          test "$(jq '.release_metric_contracts.class_counts.OUTCOME' "$catalog")" -eq 3
          test "$(jq '.release_metric_contracts.class_counts.DRIVER' "$catalog")" -eq 16
          test "$(jq '.release_metric_contracts.class_counts.GUARDRAIL' "$catalog")" -eq 20
          jq -e '.release_metric_contracts.contracts | all((.metric_id | type == "string" and length > 0) and (.class | IN("OUTCOME","DRIVER","GUARDRAIL")) and (.proof_choice | IN("FOUNDATION","COHERENCE","REGRESSION")) and (.owner_function | type == "string" and length > 0) and (.constructor == "indicator") and (.helper.path == "internal/meta/languagereadiness/toolchainrelease/indicator_helper.go") and (.helper.kind == "release_indicator_constructor_definition") and (.helper_signature | startswith("func indicator(")) and (.helper_result_fields.MetricID == "id") and (.helper_result_fields.Class == "class") and (.helper_result_fields.ProofChoice == "proof") and (.helper_result_fields.Value == "value") and (.helper_result_fields.Target == "target") and (.helper_result_fields.Relation == "relation") and (.formula_complete | type == "boolean") and (.call.path | type == "string" and length > 0) and ([.formula.actual,.formula.expected,.formula.comparator,.formula.unit,.formula.proof] | all((.expression | type == "string" and length > 0) and (.reference.path | type == "string" and length > 0) and (.reference.line | type == "number" and . >= 1))) and (.formula.unit.resolution == "UNDECLARED_IN_SOURCE"))' "$catalog" >/dev/null
          jq -e '([.release_metric_contracts.contracts[].metric_id] | unique | length) == 39 and ([.release_metric_contracts.contracts[].metric_id] | sort) == ([.release_metric_contracts.metric_ids[]] | sort)' "$catalog" >/dev/null
          jq -e '([.release_metric_contracts.contracts[] | select(.class == "OUTCOME")] | sort_by(.call.line) | .[0:2] | map(.formula.actual.expression)) == ["summary.ReadinessBPS","summary.ReadinessBPS"]' "$catalog" >/dev/null
          jq -e '([.release_metric_contracts.contracts[] | select(.class == "OUTCOME")] | sort_by(.call.line) | .[0].metric_id) != ([.release_metric_contracts.contracts[] | select(.class == "OUTCOME")] | sort_by(.call.line) | .[1].metric_id)' "$catalog" >/dev/null
          test "$(jq '[.release_metric_contracts.contracts[] | select(.formula.actual.resolved_reference.path | length > 0)] | length' "$catalog")" -eq 36
          test "$(jq '[.release_metric_contracts.contracts[] | select(.formula.expected.resolved_reference.path | length > 0)] | length' "$catalog")" -eq 16
          jq -e '[.release_metric_contracts.contracts[] | select(.formula.actual.expression == "values[index]") | select((.formula.actual.resolved_expression | type == "string" and length > 0) and (.formula.actual.resolved_reference.path | type == "string" and length > 0))] | length == 36' "$catalog" >/dev/null
          jq -e '[.release_metric_contracts.contracts[] | select(.formula.expected.expression == "targets[index]") | select((.formula.expected.resolved_expression | type == "string" and length > 0) and (.formula.expected.resolved_reference.path | type == "string" and length > 0))] | length == 16' "$catalog" >/dev/null
          jq -e '.release_metric_contracts.contracts | map(select(.metric_id == "gooo.metric.toolchain.cross-platform-release-proof-readiness-bps.v1")) | if length == 1 then .[0] else error("proof readiness contract missing or duplicated") end | select(.formula.actual.expression == "proofBPS" and .formula.actual.resolution == "CONTROL_FLOW_DEPENDENT_UNKNOWN" and (.formula.actual.alternatives | length) == 2 and .formula_complete == false)' "$catalog" >/dev/null
          test "$(jq -r '.release_metric_cohort.source_sha' "$receipt")" = "$ATLAS_SOURCE_SHA"
          test "$(jq '.release_metric_cohort.contract_count' "$receipt")" -eq 39
          test "$(jq '.release_metric_cohort.metric_count' "$receipt")" -eq 39
          test "$(jq '.release_metric_cohort.unknown_count' "$receipt")" -eq 0
          test "$(jq '.release_metric_cohort.owner_count' "$receipt")" -eq 39
          test "$(jq '.release_metric_cohort.complete_formula_count' "$receipt")" -eq 38
          test "$(jq '.release_metric_cohort.all_formula_fields_present' "$receipt")" = true
          test "$(jq -r '.release_metric_binding_validation.state' "$receipt")" = UNKNOWN
          test "$(jq -r '.native_evidence.binding.contract.state' "$receipt")" = UNKNOWN
          test "$(jq '.native_evidence.binding.contract.metric_count' "$receipt")" -eq 39
          test "$(jq '.native_evidence.binding.contract.owner_count' "$receipt")" -eq 39
          test "$(jq '.native_evidence.binding.contract.source_contract_count' "$receipt")" -eq 39
          test "$(jq '.native_evidence.binding.contract.complete_formula_count' "$receipt")" -eq 38
          test "$(jq -r '.native_evidence.binding.contract.binding_scope' "$receipt")" = SOURCE_FORMULA_ONLY_NOT_RUNTIME_EVIDENCE
          test "$(jq -r '.native_evidence.ingestion_state' "$receipt")" = UNKNOWN
          test "$(jq -r '.native_evidence.binding.activity.state' "$receipt")" = UNKNOWN
          node scripts/atlas/release-metric-binding-cases.mjs "$receipt" "$catalog" | tee "$RUNNER_TEMP/release-metric-binding-cases.json"
      - name: Verify source field guide vocabulary and unknown-field handling
        shell: bash
        run: |
          set -euo pipefail
          receipt=atlas-output/metric-map.html.receipt.json
          catalog=atlas-output/catalog.json
          test "$(jq '.source_field_vocabulary.argument_count' "$receipt")" -eq 37
          test "$(jq '.source_field_vocabulary.result_count' "$receipt")" -eq 32
          test "$(jq '.source_field_vocabulary.argument_guide_missing | length' "$receipt")" -eq 0
          test "$(jq '.source_field_vocabulary.result_guide_missing | length' "$receipt")" -eq 0
          test "$(jq '.metric_ids_and_candidates' "$receipt")" -eq 1094
          test "$(jq '.metric_labels_with_untranslated_tokens' "$receipt")" -eq 47
          test "$(jq '.concepts' "$receipt")" -eq 29
          test "$(jq '[.concepts[].use_cases] | add | length' "$catalog")" -eq 57
          node scripts/atlas/source-field-guide-cases.mjs "$receipt" "$catalog" | tee "$RUNNER_TEMP/source-field-guide-cases.json"
      - name: Verify exact-head native evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          receipt=atlas-output/metric-map.html.receipt.json
          test "$(jq -r '.native_evidence.source_head_sha' "$receipt")" = "$ATLAS_SOURCE_SHA"
          test "$(jq -r '.native_evidence.observation_state' "$receipt")" = EXACT_HEAD_SUPPLIED_NOT_INGESTED
          test "$(jq -r '.native_evidence.ingestion_state' "$receipt")" = UNKNOWN
          test "$(jq -r '.native_evidence.workflow_run_id' "$receipt")" -eq 34521687942
          test "$(jq -r '.native_evidence.artifact_id' "$receipt")" -eq 10169972879
          test "$(jq -r '.native_evidence.artifact_kind' "$receipt")" = FINAL_ELIGIBILITY_PROJECTION
          test "$(jq -r '.native_evidence.aggregate_report_artifact_id' "$receipt")" -eq 10169966229
          test "$(jq -r '.native_evidence.artifact_digest' "$receipt")" = sha256:31b3d04d823bc55118acd679dac4e56d368daad500493ecc213642775adba416
          test "$(jq -r '.native_evidence.reported_decision' "$receipt")" = EVIDENCE_CLOSED
          test "$(jq -r '.native_evidence.map_decision' "$receipt")" = UNKNOWN
          test "$(jq -r '.native_evidence.ingestion_unknown.stage' "$receipt")" = CROSS_PROJECT_INGESTION
          test "$(jq -r '.native_evidence.ingestion_unknown.step' "$receipt")" = NATIVE_ARTIFACT_DOWNLOAD_AND_DIGEST_VERIFY
          test "$(jq -r '.native_evidence.ingestion_unknown.unknown_class' "$receipt")" = DIRECT_MISSING
          test "$(jq '.native_evidence.ingestion_unknown.blocked_by | length' "$receipt")" -eq 0
          node scripts/atlas/native-evidence-cases.mjs "$receipt" | tee "$RUNNER_TEMP/native-evidence-cases.json"
      - name: Verify source-backed translation cohort
        shell: bash
        run: |
          set -euo pipefail
          receipt=atlas-output/metric-map.html.receipt.json
          test "$(jq '.metric_translation_cohort.total' "$receipt")" -eq 47
          test "$(jq '.metric_translation_cohort.source_backed_count' "$receipt")" -eq 47
          test "$(jq -r '.metric_translation_cohort.scope' "$receipt")" = AUDIT_COHORT_NOT_COMPLETENESS_DENOMINATOR
          test "$(jq '.metric_labels_with_untranslated_tokens' "$receipt")" -eq 47
          node scripts/atlas/translation-cohort-cases.mjs "$receipt" | tee "$RUNNER_TEMP/translation-cohort-cases.json"
      - name: Verify pinned source references and reject false anchors
        shell: bash
        run: |
          set -euo pipefail
          node scripts/atlas/translation-source-reference-cases.mjs atlas-output/metric-map.html.receipt.json upstream | tee "$RUNNER_TEMP/translation-source-reference-cases.json"
      - name: Verify partial source contracts and preserved cohort
        shell: bash
        run: |
          set -euo pipefail
          catalog=atlas-output/catalog.json
          test "$(jq '.source_contracts.calls | length' "$catalog")" -eq 593
          test "$(jq '.source_contracts.unresolved_calls | length' "$catalog")" -eq 97
          test "$(jq '.source_contracts.partial_calls | length' "$catalog")" -eq 97
          test "$(jq '.source_contracts.parsed_production_go_files' "$catalog")" -eq 4456
          test "$(jq '.metrics | length' "$catalog")" -eq 1094
          test "$(jq '(.source_contracts.calls | length) + (.source_contracts.unresolved_calls | length)' "$catalog")" -eq 690
          jq -e '((.source_contracts.partial_calls | map(.call.path + "#" + (.call.line | tostring) + "#" + .call.kind) | sort) == (.source_contracts.unresolved_calls | map(.path + "#" + (.line | tostring) + "#" + .kind) | sort)) and ((.source_contracts.partial_calls | map(.callsite_id) | unique | length) == (.source_contracts.partial_calls | length))' "$catalog" >/dev/null
          jq -e '.source_contracts.partial_calls | map(select(.call.path == "internal/meta/externalcapabilityexecution/assuranceeligibility/indicators.go" and .call.line == 11)) | if length == 1 then .[0] else error("assuranceeligibility partial callsite missing or duplicated") end | select((has("metric_id") | not) and ([.call_argument_expressions[] | select(contains("artifact.Name"))] | length > 0) and (.helper_candidates | length > 0) and (.helper_candidates[0].result_field_sets | length > 0) and (.unknown.missing_fields | index("metric_id") != null) and (.unknown.blocked_by | type == "array"))' "$catalog" >/dev/null
          jq -e '.source_contracts.partial_calls | map(select(.call.path == "internal/meta/externalcapabilityexecution/authorization/indicators.go" and .call.line == 25)) | if length == 1 then .[0] else error("authorization partial callsite missing or duplicated") end | select((has("metric_id") | not) and ([.call_argument_expressions[] | select(contains("spec"))] | length > 0) and ([.call_argument_expressions[] | select(contains("states[index]"))] | length > 0) and (.helper_candidates | length > 0) and (.helper_candidates[0].argument_expressions | length > 0) and (.helper_candidates[0].result_field_sets | length > 0) and (.unknown.missing_fields | index("metric_id") != null))' "$catalog" >/dev/null
          jq -e '.source_contracts.partial_calls | all(.unknown | (.stage != "HELPER_SELECTION" or (.unknown_class == "DEPENDENCY_BLOCKED" and (.blocked_by | type == "array" and length > 0))))' "$catalog" >/dev/null
          jq -e '.source_contracts.partial_calls | all(.unknown | (.stage != "ARGUMENT_BINDING" or (.unknown_class == "DIRECT_MISSING" and (.blocked_by | type == "array" and length == 0))))' "$catalog" >/dev/null
          jq -e '.source_contracts.partial_calls | all((has("metric_id") | not) and (.resolution | type == "string" and length > 0 and . == "PARTIAL_SOURCE_CONTRACT_UNKNOWN_NOT_RUNTIME_PROOF") and ([.unknown.stage,.unknown.step,.unknown.reason,.unknown.unknown_class,.unknown.next_operation] | all(type == "string" and length > 0)) and (.unknown.blocked_by | type == "array" and all(type == "string" and length > 0)) and (.unknown.missing_fields | type == "array" and all(type == "string" and length > 0)) and ((.unknown.unknown_class == "DIRECT_MISSING" and (.unknown.blocked_by | length == 0)) or (.unknown.unknown_class == "DEPENDENCY_BLOCKED" and (.unknown.blocked_by | length > 0))))' "$catalog" >/dev/null
          jq -e '.source_contracts.partial_calls | all(if .unknown.stage == "HELPER_SELECTION" then (.helper_candidates | type == "array" and length > 0) and ((.helper_candidates | map(.candidate_id)) as $ids | ($ids | all(type == "string" and length > 0)) and (($ids | unique | length) == ($ids | length))) and (.unknown.blocked_by | type == "array" and all(type == "string" and length > 0)) and ((.unknown.blocked_by | sort) == (.helper_candidates | map(.candidate_id) | sort)) else true end)' "$catalog" >/dev/null
          node scripts/atlas/partial-contract-cases.mjs "$catalog" | tee "$RUNNER_TEMP/partial-contract-cases.json"
          {
            echo '## Partial source contract checks'
            echo
            jq '{source_contract_cohort: .source_contracts | {resolved_symbolic_calls: (.calls | length), unresolved_callsites: (.unresolved_calls | length), partial_contracts: (.partial_calls | length), recognized_constructor_callsites: ((.calls | length) + (.unresolved_calls | length))}, partial_stage_counts: ([.source_contracts.partial_calls[].unknown.stage] | sort | group_by(.) | map({stage: .[0], count: length}) )}' "$catalog"
            cat "$RUNNER_TEMP/partial-contract-cases.json"
            cat "$RUNNER_TEMP/source-field-guide-cases.json"
            cat "$RUNNER_TEMP/native-evidence-cases.json"
            cat "$RUNNER_TEMP/translation-cohort-cases.json"
            cat "$RUNNER_TEMP/translation-source-reference-cases.json"
            cat "$RUNNER_TEMP/release-metric-binding-cases.json"
            echo
            echo 'AST fixture test: executed against collectContracts in the disposable upstream source copy'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify lossless source definition bindings
        shell: bash
        run: |
          set -euo pipefail
          node scripts/atlas/source-definition-binding-cases.mjs atlas-output/metric-map.html.receipt.json atlas-output/catalog.json | tee "$RUNNER_TEMP/source-definition-binding-cases.json"
          {
            echo
            echo '## Source definition binding checks'
            cat "$RUNNER_TEMP/source-definition-binding-cases.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: language-metric-atlas-${{ github.event.pull_request.head.sha || github.sha }}
          path: atlas-output/
          if-no-files-found: error
          retention-days: 14
