name: Relay contract observation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: game
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: ab91e6ec8ae7d587acbfc3d041f6edacefc02f05
          path: compiler
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: compiler/go.sum
      - name: Build pinned compiler and capture contract observations
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/relay-evidence"
          go build -mod=readonly -o "$RUNNER_TEMP/gooo" ./cmd/gooo
          "$RUNNER_TEMP/gooo" check --json "$GITHUB_WORKSPACE/game/examples/relay-game/main.gooo" > "$RUNNER_TEMP/relay-evidence/check.json"
          "$RUNNER_TEMP/gooo" graph dump "$GITHUB_WORKSPACE/game/examples/relay-game/main.gooo" > "$RUNNER_TEMP/relay-evidence/graph.json"
          cp "$GITHUB_WORKSPACE/game/examples/relay-game/main.gooo" "$RUNNER_TEMP/relay-evidence/main.gooo"
          printf '%s\n' 'Compiler: ab91e6ec8ae7d587acbfc3d041f6edacefc02f05' 'Scope: contract check and graph only; runtime forwarding and game semantics unverified.' > "$RUNNER_TEMP/relay-evidence/scope.txt"
          sha256sum "$RUNNER_TEMP/relay-evidence/main.gooo" > "$RUNNER_TEMP/relay-evidence/source.sha256"
      - name: Observe runtime forwarding, replay and rejected inputs
        if: ${{ !cancelled() }}
        run: node game/scripts/relay-runtime-check.mjs "$RUNNER_TEMP/gooo" "$GITHUB_WORKSPACE/game/examples/relay-game/main.gooo" "$RUNNER_TEMP/relay-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-contract-${{ github.sha }}
          path: ${{ runner.temp }}/relay-evidence
          if-no-files-found: warn
